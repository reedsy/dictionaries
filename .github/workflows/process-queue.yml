name: Analyse new dictionary words

on:
  schedule:
    - cron: '0 0 1 * *' # 12:00AM UTC, day 1 of the month
  workflow_dispatch:
  push:
    branches: ['word-analysis-action'] # todo: remove once testing complete

permissions:
  contents: write
  id-token: write
  pull-requests: write

jobs:
  process:
    runs-on: ubuntu-24.04

    strategy:
      matrix:
        dictionary:
          # - en/en_AU
          # - en/en_CA
          - en/en_GB
          - en/en_US
          # - en/en_ZA
      fail-fast: false

    env:
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: speedy-atom-247708
          workload_identity_provider: projects/683371064814/locations/global/workloadIdentityPools/production-github-actions/providers/production-github-actions

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v3
        with:
          version: '>= 363.0.0'

      - name: Download queue from GCS
        run: |
          set -euo pipefail
          gsutil -m cp -r gs://production-reedsy-editor-auxiliary/dictionaries ./queue/

      - name: Process dictionary
        id: process
        uses: reedsy/reedsy-dictionary-automation@v1
        with:
          dictionary: ${{ matrix.dictionary }}
          queue-path: ./queue
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit and create PR
        env:
          GH_TOKEN: ${{ secrets.REEDSY_BOT_PERSONAL_ACCESS_TOKEN }}
        run: |
          DICT_FLAT=$(echo "${{ matrix.dictionary }}" | tr '/' '-')
          RAND=$(openssl rand -hex 4)
          BRANCH_NAME="reedsy-bot/add-words/${DICT_FLAT}/${RAND}"

          git config user.name "GitHub Action"
          git config user.email "github@reedsy.com"

          git checkout -B "$BRANCH_NAME"
          git add .
          git commit -m "Update ${{ matrix.dictionary }} dictionary"
          git push origin "$BRANCH_NAME"

          cat > pr-body.md <<EOF
          ## Dictionary Update: ${{ matrix.dictionary }}

          Automated dictionary updates from [Reedsy Dictionary Automation](https://github.com/reedsy/reedsy-dictionary-automation).

          - Words analysed: ${{ steps.process.outputs.number-of-words-analysed }}
          - Words added: ${{ steps.process.outputs.number-of-words-added }}

          ---

          [Workflow run]($RUN_URL)
          EOF

          gh pr create \
            --draft \
            --base master \
            --head "$BRANCH_NAME" \
            --title "Update ${{ matrix.dictionary }} dictionary" \
            --body-file pr-body.md
